###
# admin-ui pipeline configuration, layered over cicd/config.ini and cicd/frontend/config.ini.
#
# VITE_* values are written to admin-ui/.env.production for `yarn build` (Vite bakes them into the bundle,
# so never put a secret here). They were seeded from admin-ui/.env.playwright, which holds every key the
# build requires, with local/mocked hosts mapped to the target environment and links to sibling
# atlas-index apps kept inside the same environment. Other ALA service URLs were kept as they are:
# DG-6, check them against the legacy deployment before the first deploy.
# Mocks of other ALA services (Biocache, images, DataCite) use their legacy test URLs, not search-service.

[DEFAULT]
UI_APP = admin-ui
UI_HOST = ${ADMIN_UI_HOST}

VITE_HOME_URL = https://ala.org.au
VITE_ENV = ${ENVIRONMENT}
VITE_APP_BASE_URL = https://${ADMIN_UI_HOST}
VITE_APP_API_URL = https://${SERVICE_HOST}
VITE_APP_BIE_URL = https://${SERVICE_HOST}
VITE_APP_BIOCACHE_URL = https://biocache-ws.test.ala.org.au/ws
VITE_APP_IMAGE_THUMBNAIL_URL = https://images.test.ala.org.au/image/proxyImageThumbnail?imageId=
VITE_APP_IMAGE_LINK_URL = https://images.test.ala.org.au/image/
VITE_ADMIN_ROLE = ROLE_ADMIN
VITE_TAXON_DESCRIPTIONS_URL = ${STATIC_URL}/taxon-descriptions
VITE_DATACITE_API_URL = https://api.test.datacite.org
VITE_COMMON_HEADER_HTML = ${COMMON_UI_URL}/banner.mustache
VITE_COMMON_FOOTER_HTML = ${COMMON_UI_URL}/footer.mustache
VITE_COMMON_CSS = ${COMMON_UI_URL}/css/ala-combined.css
VITE_COMMON_JS = ${COMMON_UI_URL}/js/ala-combined.js
VITE_COMMON_CONTAINER_CLASS = container-fluid
VITE_SEARCH_URL_PREFIX = https://${SEARCH_UI_HOST}
VITE_BANNER_MESSAGES_URL = https://${SERVICE_HOST}/v2/banner
VITE_BANNER_SCOPE = admin
VITE_SWAGGER_SOURCES = biocache-service|https://biocache-ws.test.ala.org.au/ws/v3/api-docs;spatial-service|https://spatial.test.ala.org.au/ws/openapi/openapi.json;lists-service|https://lists-ws.test.ala.org.au/v3/api-docs;namematching-service|https://namematching-ws.test.ala.org.au/openapi.json;userdetails|https://userdetails.test.ala.org.au/openapi/openapi.json;atlas-index/search-service|https://${SERVICE_HOST}/api-docs;images|https://images.ala.org.au/openapi/openapi.json;alerts|https://alerts.test.ala.org.au/openapi/openapi.json;collectory|https://collections.ala.org.au/openapi/openapi.json;sensitive-service|https://sensitive-ws.test.ala.org.au/swagger.json
