###
# regions-ui pipeline configuration, layered over cicd/config.ini and cicd/frontend/config.ini.
#
# VITE_* values are written to regions-ui/.env.production for `yarn build` (Vite bakes them into the bundle,
# so never put a secret here). They were seeded from regions-ui/.env.playwright, which holds every key the
# build requires, with local/mocked hosts mapped to the target environment and links to sibling
# atlas-index apps kept inside the same environment. Other ALA service URLs were kept as they are:
# DG-6, check them against the legacy deployment before the first deploy.
# A value of secretsmanager:<secret-id>:<json-key> is resolved at build time.

[DEFAULT]
UI_APP = regions-ui
UI_HOST = ${REGIONS_UI_HOST}

VITE_HOME_URL = https://ala.org.au
VITE_LOGIN_URL = https://userdetails.ala.org.au/myprofile
VITE_LOGO_URL = https://www.ala.org.au/app/uploads/2019/01/logo.png
VITE_AUTH_COOKIE = Test-Local=
VITE_AUTH_COOKIE_DOMAIN = ${HOSTED_ZONE}
VITE_ENV = ${ENVIRONMENT}
VITE_APP_BASE_URL = https://${REGIONS_UI_HOST}
VITE_APP_ALERT_RESOURCE_NAME = Atlas of Living Australia
VITE_APP_API_URL = https://${SERVICE_HOST}
VITE_APP_BIOCACHE_URL = https://biocache-ws.ala.org.au/ws
VITE_NAMEMATCHING_WS = https://namematching-ws.ala.org.au
VITE_SPECIES_URL_PREFIX = https://${SEARCH_UI_HOST}/species/
VITE_APP_BIOCACHE_UI_URL = https://biocache.ala.org.au
VITE_SPATIAL_WS_URL = https://spatial.ala.org.au/ws
VITE_SPATIAL_GEOSERVER_URL = https://spatial.ala.org.au/geoserver
VITE_CONTACT_URL = https://www.ala.org.au/contact-us/
VITE_CREATE_ACCOUNT_URL = https://userdetails.ala.org.au/registration/createAccount
VITE_COMMON_HEADER_HTML = ${COMMON_UI_URL}/banner.mustache
VITE_COMMON_FOOTER_HTML = ${COMMON_UI_URL}/footer.mustache
VITE_COMMON_CSS = ${COMMON_UI_URL}/css/ala-combined.css
VITE_COMMON_JS = ${COMMON_UI_URL}/js/ala-combined.js
VITE_BANNER_MESSAGES_URL = https://${SERVICE_HOST}/v2/banner
VITE_SEARCH_URL_PREFIX = https://${SEARCH_UI_HOST}
VITE_COMMON_CONTAINER_CLASS = container-fluid
VITE_BANNER_SCOPE = regions
VITE_REGIONS_CONFIG_URL = ./assets/regionsList.json
VITE_APP_ALERTS_URL = https://alerts.ala.org.au
VITE_MAP_CENTRE_LAT = -28
VITE_MAP_CENTRE_LNG = 133
VITE_MAP_DEFAULT_ZOOM = 4
VITE_GLOBAL_FQ = &fq=species%3A*&fq=-occurrenceStatus%3Aabsent&fq=spatiallyValid%3Atrue
VITE_PLAYER_INTERVAL_MILLISECONDS = 1000
VITE_EXPLORE_URL = https://www.ala.org.au/explore-by-location/
VITE_SPECIES_PAGE_URL = https://${SEARCH_UI_HOST}/species/
VITE_DOWNLOAD_URL = https://biocache.ala.org.au/download/options1?targetUri=%2Foccurrence%2Fsearch&searchParams=
# DG-6: empty disables the Google base layers; use secretsmanager:<secret-id>:<json-key> to enable
VITE_GOOGLE_MAP_API_KEY = 
VITE_OPENSTREETMAP_ZXY_URL = https://spatial.ala.org.au/osm/{z}/{x}/{y}.png
VITE_OPENSTREETMAP_ZXY_ATTRIBUTION = &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors
VITE_OSM_VECTOR_TILE_STYLE_URL = 

