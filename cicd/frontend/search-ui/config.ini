###
# search-ui pipeline configuration, layered over cicd/config.ini and cicd/frontend/config.ini.
#
# VITE_* values are written to search-ui/.env.production for `yarn build` (Vite bakes them into the bundle,
# so never put a secret here). They were seeded from search-ui/.env.playwright, which holds every key the
# build requires, with local/mocked hosts mapped to the target environment and links to sibling
# atlas-index apps kept inside the same environment. Other ALA service URLs were kept as they are:
# DG-6, check them against the legacy deployment before the first deploy.
# A value of secretsmanager:<secret-id>:<json-key> is resolved at build time.

[DEFAULT]
UI_APP = search-ui
UI_HOST = ${SEARCH_UI_HOST}
PLAYWRIGHT_VARIANT_ENV = VITE_APP_MEDIA_LICENCE_FILTER_ENABLED=true
PLAYWRIGHT_VARIANT_SPEC = tests/acceptance.spec.ts
PLAYWRIGHT_VARIANT_GREP = shows licence refine options only when the filter is enabled

VITE_ENV = ${ENVIRONMENT}
VITE_APP_BASE_URL = https://${SEARCH_UI_HOST}
VITE_APP_API_URL = https://${SERVICE_HOST}
VITE_HOME_URL = https://ala.org.au
VITE_LOGIN_URL = https://userdetails.test.ala.org.au/myprofile
VITE_LOGO_URL = https://www.ala.org.au/app/uploads/2019/01/logo.png
VITE_AUTH_COOKIE = ALA-Auth-Test-Local=
VITE_AUTH_COOKIE_DOMAIN = ${HOSTED_ZONE}
VITE_COMMON_HEADER_HTML = ${COMMON_UI_URL}/banner.mustache
VITE_COMMON_FOOTER_HTML = ${COMMON_UI_URL}/footer.mustache
VITE_COMMON_CSS = ${COMMON_UI_URL}/css/ala-combined.css
VITE_COMMON_JS = ${COMMON_UI_URL}/js/ala-combined.js
VITE_COMMON_CONTAINER_CLASS = container-fluid
VITE_BANNER_MESSAGES_URL = https://${SERVICE_HOST}/v2/banner
VITE_BANNER_SCOPE = species
VITE_SEARCH_URL_PREFIX = https://${SEARCH_UI_HOST}
VITE_APP_BIOCACHE_URL = https://biocache-ws.ala.org.au/ws
VITE_APP_BIOCACHE_UI_URL = https://biocache.ala.org.au
VITE_BIOCACHE_UI_URL = https://biocache.ala.org.au
VITE_APP_MEDIA_LICENCE_FILTER_ENABLED = false
VITE_GLOBAL_FQ = &fq=-occurrenceStatus%3Aabsent&fq=spatiallyValid%3Atrue&qualityProfile=ALA
VITE_APP_IMAGE_BASE_URL = https://images.test.ala.org.au
VITE_APP_IMAGE_API_URL = https://images.test.ala.org.au/ws
VITE_APP_IMAGE_THUMBNAIL_URL = https://images.test.ala.org.au/image/proxyImageThumbnail?imageId=
VITE_TAXON_DESCRIPTIONS_URL = ${STATIC_URL}/taxon-descriptions
VITE_TAXON_TRAITS_URL = ${STATIC_URL}/taxon-traits
VITE_TAXON_BHL_URL = ${STATIC_URL}/taxon-bhl
VITE_TAXON_MAP_URL = ${STATIC_URL}/taxon-map
VITE_APP_AUSTRAITS_LOGO = ${STATIC_URL}/images/austraitslogo.png
VITE_COLLECTIONS_URL = https://collections.ala.org.au
VITE_SPATIAL_URL = https://spatial.ala.org.au
VITE_REGIONS_URL = https://${REGIONS_UI_HOST}
VITE_SPECIESLIST_URL = https://lists.ala.org.au
VITE_APP_BIOCOLLECT_URL = https://biocollect.ala.org.au
