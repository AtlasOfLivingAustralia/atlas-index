AWSTemplateFormatVersion: '2010-09-09'
Description: Code pipeline for one atlas-index UI (deploy with cicd/deploy_pipeline.sh -c frontend -u <ui>)

Parameters:
  pAllowTeardown:
    Description: enables or disables the teardown stage
    Type: String
    AllowedValues:
      - true
      - false
  pAutoDeploy:
    Type: String
    Description: Sets the pipeline to autodeploy on repo changes
  pBaseStackName:
    Type: String
    Description: The name of the base stack (Playwright reports bucket and build image)
  pBootstrapStackName:
    Type: String
    Description: The name of the bootstrap stack
  pBucketsStackName:
    Type: String
    Description: The name of the bucket stack
  pCleanBranch:
    Type: String
    Description: A cleaned version of the code branch name
    Default: development
  pEnvironment:
    Type: String
    Description: The AWS environment this belongs to
  pGitHubRepositoryName:
    Type: String
    Description: GitHub repository name.
  pGitHubOwner:
    Type: String
    Description: GitHub owner
  pGitHubBranch:
    Type: String
    Description: GitHub branch we're deploying from
  pPipelineFingerprint:
    Type: String
    Description: The fingerprint of the pipeline, used to determine if it's been modified
  pProductComponent:
    Type: String
    Description: The name of the product component
  pProductName:
    Type: String
    Description: The name of the product
  pRestartExecutionOnUpdate:
    Type: String
    Description: Restart that pipeline if it's been updated
    AllowedValues:
      - true
      - false
  pUiApp:
    Type: String
    Description: The UI workspace this pipeline builds, e.g. search-ui

Conditions:
  IsDev: !Equals
    - !Ref pEnvironment
    - development
  AutoDeploy: !Equals
    - !Ref pAutoDeploy
    - true
  AllowTeardown: !Equals
    - !Ref pAllowTeardown
    - true

Resources:
  ExportConfig:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub
              - ${pProductName}-${pUiApp}-export-config-${ResourceName}
              - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]
      Description: Load the environment, build the site template config and the Vite build config
      ServiceRole:
        Fn::ImportValue:
          Fn::Sub: ${pBootstrapStackName}-CodeBuildServiceRoleArn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
      Source:
        Type: CODEPIPELINE
        BuildSpec: cicd/frontend/pipeline/export_config_buildspec.yaml
      TimeoutInMinutes: 10

  BuildRelease:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub
              - ${pProductName}-${pUiApp}-build-release-${ResourceName}
              - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]
      Description: !Sub Unit test and build ${pUiApp} for the environment
      ServiceRole:
        Fn::ImportValue:
          Fn::Sub: ${pBootstrapStackName}-CodeBuildServiceRoleArn
      Artifacts:
        Type: CODEPIPELINE
      Cache:
        Type: S3
        Location: !Sub
          - ${Bucket}/${pProductName}/yarn-cache/${pUiApp}
          - Bucket:
              Fn::ImportValue:
                Fn::Sub: ${pBucketsStackName}-${AWS::Region}-CodePipelineArtifactBucketName
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: !Sub
          - ${Uri}:latest
          - Uri:
              Fn::ImportValue:
                Fn::Sub: ${pBaseStackName}-PlaywrightImageRepositoryUri
        ImagePullCredentialsType: CODEBUILD
        EnvironmentVariables:
          - Name: UI_APP
            Value: !Ref pUiApp
      Source:
        Type: CODEPIPELINE
        BuildSpec: cicd/frontend/pipeline/build_release_buildspec.yaml
      TimeoutInMinutes: 30

  BuildPlaywrightBundle:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub
              - ${pProductName}-${pUiApp}-build-playwright-${ResourceName}
              - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]
      Description: !Sub Build the instrumented Playwright bundle of ${pUiApp}
      ServiceRole:
        Fn::ImportValue:
          Fn::Sub: ${pBootstrapStackName}-CodeBuildServiceRoleArn
      Artifacts:
        Type: CODEPIPELINE
      Cache:
        Type: S3
        Location: !Sub
          - ${Bucket}/${pProductName}/yarn-cache/${pUiApp}
          - Bucket:
              Fn::ImportValue:
                Fn::Sub: ${pBucketsStackName}-${AWS::Region}-CodePipelineArtifactBucketName
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: !Sub
          - ${Uri}:latest
          - Uri:
              Fn::ImportValue:
                Fn::Sub: ${pBaseStackName}-PlaywrightImageRepositoryUri
        ImagePullCredentialsType: CODEBUILD
        EnvironmentVariables:
          - Name: UI_APP
            Value: !Ref pUiApp
      Source:
        Type: CODEPIPELINE
        BuildSpec: cicd/frontend/pipeline/build_playwright_bundle_buildspec.yaml
      TimeoutInMinutes: 30

  # The Playwright gate: every browser in one container against the prebuilt bundle (see cicd/README.md)
  PlaywrightTests:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub
              - ${pProductName}-${pUiApp}-playwright-${ResourceName}
              - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]
      Description: !Sub Playwright tests of ${pUiApp}, gating the deploy
      ServiceRole:
        Fn::ImportValue:
          Fn::Sub: ${pBootstrapStackName}-CodeBuildServiceRoleArn
      Artifacts:
        Type: CODEPIPELINE
      Cache:
        Type: S3
        Location: !Sub
          - ${Bucket}/${pProductName}/yarn-cache/${pUiApp}
          - Bucket:
              Fn::ImportValue:
                Fn::Sub: ${pBucketsStackName}-${AWS::Region}-CodePipelineArtifactBucketName
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: !Sub
          - ${Uri}:latest
          - Uri:
              Fn::ImportValue:
                Fn::Sub: ${pBaseStackName}-PlaywrightImageRepositoryUri
        ImagePullCredentialsType: CODEBUILD
        EnvironmentVariables:
          - Name: UI_APP
            Value: !Ref pUiApp
          - Name: REPORTS_BUCKET
            Value:
              Fn::ImportValue:
                Fn::Sub: ${pBaseStackName}-PlaywrightReportsBucketName
      Source:
        Type: CODEPIPELINE
        BuildSpec: cicd/frontend/pipeline/playwright_buildspec.yaml
      TimeoutInMinutes: 45

  Publish:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub
              - ${pProductName}-${pUiApp}-publish-${ResourceName}
              - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]
      Description: !Sub Publish ${pUiApp} to its bucket and invalidate CloudFront
      ServiceRole:
        Fn::ImportValue:
          Fn::Sub: ${pBootstrapStackName}-CodeBuildServiceRoleArn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
      Source:
        Type: CODEPIPELINE
        BuildSpec: cicd/frontend/pipeline/publish_buildspec.yaml
      TimeoutInMinutes: 15

  EmptyBucket:
    Condition: AllowTeardown
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub
              - ${pProductName}-${pUiApp}-empty-bucket-${ResourceName}
              - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]
      Description: Empty the site bucket so it can be deleted
      ServiceRole:
        Fn::ImportValue:
          Fn::Sub: ${pBootstrapStackName}-CodeBuildServiceRoleArn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
      Source:
        Type: CODEPIPELINE
        BuildSpec: cicd/empty_bucket_buildspec.yaml
      TimeoutInMinutes: 10

  DeployNotification:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub
              - ${pProductName}-${pUiApp}-deploy-notification-${ResourceName}
              - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]
      Description: Send out the deploy notifications
      ServiceRole:
        Fn::ImportValue:
          Fn::Sub: ${pBootstrapStackName}-CodeBuildServiceRoleArn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
      Source:
        Type: CODEPIPELINE
        BuildSpec: cicd/deploy_notification_buildspec.yaml
      TimeoutInMinutes: 5

  Pipeline:
    Type: 'AWS::CodePipeline::Pipeline'
    Properties:
      Name: !Sub
              - ${pProductName}-${pUiApp}-${ResourceName}
              - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]
      PipelineType: V2
      RoleArn:
        Fn::ImportValue:
          Fn::Sub: ${pBootstrapStackName}-CodePipelineServiceRoleArn
      ArtifactStore:
        Type: S3
        Location:
          Fn::ImportValue:
            Fn::Sub: ${pBucketsStackName}-${AWS::Region}-CodePipelineArtifactBucketName
      DisableInboundStageTransitions: !If
        - AllowTeardown
        - - Reason: To prevent accidental teardown
            StageName: Teardown
        - !Ref AWS::NoValue
      RestartExecutionOnUpdate: !Ref pRestartExecutionOnUpdate
      # Selective deploys: this UI only runs for changes to its own workspace, the shared workspace and
      # root Yarn config (fan out to every UI), static-server (its files feed every UI's Playwright
      # tests), or the CI/CD files it uses. CodePipeline allows at most 8 paths per filter.
      Triggers:
        - ProviderType: CodeStarSourceConnection
          GitConfiguration:
            Push:
              - Branches:
                  Includes:
                    - !If [ AutoDeploy, !Ref pGitHubBranch, bogo-branch ]
                FilePaths:
                  Includes:
                    - !Sub ${pUiApp}/**
                    - common-ui/**
                    - static-server/**
                    - package.json
                    - yarn.lock
                    - .yarnrc.yml
                    - .yarn/**
                    - .nvmrc
                  Excludes:
                    - '**/*.md'
              - Branches:
                  Includes:
                    - !If [ AutoDeploy, !Ref pGitHubBranch, bogo-branch ]
                FilePaths:
                  Includes:
                    - cicd/*
                    - cicd/frontend/*
                    - cicd/frontend/app/**
                    - cicd/frontend/pipeline/**
                    - cicd/frontend/scripts/**
                    - !Sub cicd/frontend/${pUiApp}/**
                  Excludes:
                    - '**/*.md'
            SourceActionName: CheckoutSrc
      Variables:
        - Name: PIPELINE_FINGERPRINT
          DefaultValue: !Ref pPipelineFingerprint
          Description: The fingerprint of the pipeline, used to determine if it's been modified
      Stages:
        - Name: Checkout_Source
          Actions:
            - Name: CheckoutSrc
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: 1
              Configuration:
                ConnectionArn:
                  Fn::ImportValue:
                    Fn::Sub: ${pBootstrapStackName}-CodestarConnectionArn
                FullRepositoryId: !Sub ${pGitHubOwner}/${pGitHubRepositoryName}
                BranchName: !Ref pGitHubBranch
                OutputArtifactFormat: CODEBUILD_CLONE_REF
                DetectChanges: !Ref pAutoDeploy
              Namespace: CheckoutSrcNS
              OutputArtifacts:
                - Name: SourceArtifact
        - Name: Deploy_Infrastructure
          Actions:
            - Name: ExportConfig
              ActionTypeId:
                Owner: AWS
                Category: Build
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref ExportConfig
                EnvironmentVariables: !Sub |
                  [
                    { "name":"CLEAN_BRANCH", "value":"${pCleanBranch}" },
                    { "name":"COMMIT_ID", "value":"#{CheckoutSrcNS.CommitId}" },
                    { "name":"ENVIRONMENT", "value":"${pEnvironment}" },
                    { "name":"PIPELINE_FINGERPRINT", "value":"#{variables.PIPELINE_FINGERPRINT}" },
                    { "name":"PRODUCT_COMPONENT", "value":"${pProductComponent}" },
                    { "name":"SRC_BRANCH", "value":"#{CheckoutSrcNS.BranchName}" },
                    { "name":"UI_APP", "value":"${pUiApp}" }
                  ]
              Namespace: ExportConfigNS
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: ExportConfigArtifact
              RunOrder: 1
            - Name: DeploySiteCFStack
              ActionTypeId:
                Owner: AWS
                Category: Deploy
                Version: 1
                Provider: CloudFormation
              Configuration:
                TemplatePath: 'ExportConfigArtifact::cicd/frontend/app/site.yaml'
                TemplateConfiguration: 'ExportConfigArtifact::cicd/frontend/app/site_template_config.json'
                ActionMode: !If [ IsDev, REPLACE_ON_FAILURE, CREATE_UPDATE ]
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND
                RoleArn:
                  Fn::ImportValue:
                    Fn::Sub: '${pBootstrapStackName}-CloudFormationServiceRoleArn'
                StackName: '#{ExportConfigNS.APP_STACK_NAME}'
              InputArtifacts:
                - Name: ExportConfigArtifact
              Namespace: SiteCloudFormationOutNS
              RunOrder: 2
        - Name: Build_and_Test
          Actions:
            - Name: BuildRelease
              ActionTypeId:
                Owner: AWS
                Category: Build
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref BuildRelease
                PrimarySource: SourceArtifact
              InputArtifacts:
                - Name: SourceArtifact
                - Name: ExportConfigArtifact
              OutputArtifacts:
                - Name: BuildReleaseArtifact
              RunOrder: 1
            - Name: BuildPlaywrightBundle
              ActionTypeId:
                Owner: AWS
                Category: Build
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref BuildPlaywrightBundle
                PrimarySource: SourceArtifact
              InputArtifacts:
                - Name: SourceArtifact
                - Name: ExportConfigArtifact
              OutputArtifacts:
                - Name: PlaywrightBundleArtifact
              RunOrder: 1
            - Name: PlaywrightTests
              ActionTypeId:
                Owner: AWS
                Category: Build
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref PlaywrightTests
                PrimarySource: SourceArtifact
                EnvironmentVariables: |
                  [
                    { "name":"EXECUTION_ID", "value":"#{codepipeline.PipelineExecutionId}" }
                  ]
              InputArtifacts:
                - Name: SourceArtifact
                - Name: ExportConfigArtifact
                - Name: PlaywrightBundleArtifact
              RunOrder: 2
        - Name: Publish
          Actions:
            - Name: Publish
              ActionTypeId:
                Owner: AWS
                Category: Build
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref Publish
                PrimarySource: SourceArtifact
                EnvironmentVariables: |
                  [
                    { "name":"DISTRIBUTION_ID", "value":"#{SiteCloudFormationOutNS.DistributionId}" }
                  ]
              InputArtifacts:
                - Name: SourceArtifact
                - Name: ExportConfigArtifact
                - Name: BuildReleaseArtifact
              RunOrder: 1
            - Name: DeployNotification
              ActionTypeId:
                Owner: AWS
                Category: Build
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref DeployNotification
                EnvironmentVariables: !Sub |
                  [
                    { "name":"AUTHOR", "value":"#{CheckoutSrcNS.AuthorDisplayName}" },
                    { "name":"COMMIT_ID", "value":"#{CheckoutSrcNS.CommitId}" },
                    { "name":"DEPLOY_URL", "value":"#{ExportConfigNS.DEPLOY_URL}" },
                    { "name":"ENVIRONMENT", "value":"${pEnvironment}" },
                    { "name":"EXECUTION_ID", "value":"#{codepipeline.PipelineExecutionId}" },
                    { "name":"PRODUCT_COMPONENT", "value":"${pUiApp}" },
                    { "name":"PRODUCT_NAME", "value":"#{ExportConfigNS.PRODUCT_NAME}" },
                    { "name":"REPO", "value":"#{CheckoutSrcNS.FullRepositoryName}" },
                    { "name":"SLACK_ALERT_CHANNEL", "value":"#{ExportConfigNS.SLACK_ALERT_CHANNEL}" },
                    { "name":"SLACK_DEPLOY_NOTIFICATION", "value":"#{ExportConfigNS.SLACK_DEPLOY_NOTIFICATION}" },
                    { "name":"SRC_BRANCH", "value":"${pGitHubBranch}" }
                  ]
              InputArtifacts:
                - Name: SourceArtifact
              RunOrder: 2
        - !If
          - AllowTeardown
          - Name: Teardown
            Actions:
              - Name: Approval
                ActionTypeId:
                  Owner: AWS
                  Category: Approval
                  Version: 1
                  Provider: Manual
                Configuration:
                  CustomData: Approval required to tear down this site
                RunOrder: 1
              - Name: EmptyBucket
                ActionTypeId:
                  Owner: AWS
                  Category: Build
                  Version: 1
                  Provider: CodeBuild
                Configuration:
                  ProjectName: !Ref EmptyBucket
                  EnvironmentVariables: |
                    [
                      { "name":"SOURCE_BUCKET", "value":"#{SiteCloudFormationOutNS.BucketName}" }
                    ]
                InputArtifacts:
                  - Name: SourceArtifact
                RunOrder: 2
              - Name: TeardownSite
                ActionTypeId:
                  Owner: AWS
                  Category: Deploy
                  Version: 1
                  Provider: CloudFormation
                Configuration:
                  ActionMode: DELETE_ONLY
                  StackName: '#{ExportConfigNS.APP_STACK_NAME}'
                  RoleArn:
                    Fn::ImportValue:
                      Fn::Sub: '${pBootstrapStackName}-CloudFormationServiceRoleArn'
                RunOrder: 3
              - Name: ApprovalForPipelineTeardown
                ActionTypeId:
                  Owner: AWS
                  Category: Approval
                  Version: 1
                  Provider: Manual
                Configuration:
                  CustomData: Approval required to tear down this pipeline
                RunOrder: 4
              - Name: TeardownCodePipeline
                ActionTypeId:
                  Owner: AWS
                  Category: Deploy
                  Version: 1
                  Provider: CloudFormation
                Configuration:
                  ActionMode: DELETE_ONLY
                  StackName: !Ref AWS::StackName
                  RoleArn:
                    Fn::ImportValue:
                      Fn::Sub: '${pBootstrapStackName}-CloudFormationServiceRoleArn'
                RunOrder: 5
          - !Ref AWS::NoValue

  ExportConfigLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/codebuild/${ExportConfig}
      RetentionInDays: 30

  BuildReleaseLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/codebuild/${BuildRelease}
      RetentionInDays: 30

  BuildPlaywrightBundleLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/codebuild/${BuildPlaywrightBundle}
      RetentionInDays: 30

  PlaywrightTestsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/codebuild/${PlaywrightTests}
      RetentionInDays: 30

  PublishLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/codebuild/${Publish}
      RetentionInDays: 30

  EmptyBucketLogGroup:
    Condition: AllowTeardown
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/codebuild/${EmptyBucket}
      RetentionInDays: 30

  DeployNotificationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/codebuild/${DeployNotification}
      RetentionInDays: 30

Outputs:
  PipelineName:
    Value: !Ref Pipeline

  PipelineUrl:
    Value: !Sub https://console.aws.amazon.com/codepipeline/home?region=${AWS::Region}#/view/${Pipeline}
