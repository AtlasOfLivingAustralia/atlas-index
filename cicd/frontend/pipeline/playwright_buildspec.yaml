version: 0.2
###
# The Playwright gate: every browser against the prebuilt bundle, one merged report, fail on any failure

env:
  shell: bash

phases:
  install:
    commands:
      - yarn workspaces focus "$UI_APP" @ala/common-ui
  build:
    commands:
      - set -a; source "$CODEBUILD_SRC_DIR_ExportConfigArtifact/env.sh"; set +a
      - cicd/frontend/scripts/playwright_test.sh

reports:
  playwright:
    base-directory: .pw-report
    files:
      - junit.xml
    file-format: JUNITXML

cache:
  paths:
    - /root/.yarn/berry/cache/**/*
