version: 0.2
###
# The Playwright gate: merge all shard reports, publish the HTML report, fail on any failed shard

env:
  shell: bash

phases:
  build:
    commands:
      - set -a; source "$CODEBUILD_SRC_DIR_ExportConfigArtifact/env.sh"; set +a
      - export SHARD_TOTAL=$SHARDS_PER_BROWSER
      - cicd/frontend/scripts/playwright_report.sh

reports:
  playwright:
    base-directory: .pw-report
    files:
      - junit.xml
    file-format: JUNITXML
