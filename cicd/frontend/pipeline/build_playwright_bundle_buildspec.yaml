version: 0.2
###
# Build the instrumented Playwright bundle(s) once, in parallel with the release build

env:
  shell: bash

phases:
  install:
    commands:
      - yarn workspaces focus "$UI_APP" @ala/common-ui
  build:
    commands:
      # VITE_* stay out: Vite lets real env vars beat .env.playwright, which would point the bundle at live hosts
      - set -a; eval "$(grep -v '^VITE_' "$CODEBUILD_SRC_DIR_ExportConfigArtifact/env.sh")"; set +a
      - cicd/frontend/scripts/playwright_bundle.sh

artifacts:
  base-directory: .pw-bundle
  files:
    - '**/*'

cache:
  paths:
    - /root/.yarn/berry/cache/**/*
