###
# Shared settings for every UI pipeline (one pipeline per *-ui workspace). Each UI adds
# cicd/frontend/<ui>/config.ini on top of this file, defining at least UI_APP, UI_HOST and its
# VITE_* build configuration.

[DEFAULT]
PRODUCT_COMPONENT = frontend
PIPELINE_STACK_NAME = ala-${PRODUCT_NAME}-${UI_APP}-pipeline-${ENVIRONMENT}
APP_STACK_NAME = ala-${PRODUCT_NAME}-${UI_APP}-${ENVIRONMENT}
SOURCE_BUCKET = ala-${PRODUCT_NAME}-${UI_APP}-${ENVIRONMENT}
DEPLOY_URL = https://${UI_HOST}
# Google Maps browser key (occurrence, regions and search UIs). It ships in the public bundle by design;
# Google limits it by HTTP referrer, which must include the *-cicd hosts.
GOOGLE_MAP_API_KEY = AIzaSyCmFl6Ba9XaAihAi0fFzrVXh6067NVR16U

# Cache-Control max-age (seconds) for non-hashed files; index.html is always no-cache and
# assets/* (content hashed) are immutable
MAX_AGE = 300
# superseded hashed assets are kept this long so open browser sessions can still lazy-load chunks
ASSET_RETENTION_DAYS = 14

# Playwright gate: every browser in one container, see cicd/README.md
PLAYWRIGHT_BROWSERS = chromium, firefox, webkit
PLAYWRIGHT_WORKERS = 6
# a second, targeted run against a variant build, as run-playwright-test.sh does
PLAYWRIGHT_VARIANT_ENV =
PLAYWRIGHT_VARIANT_SPEC =
PLAYWRIGHT_VARIANT_GREP =

[development]
PIPELINE_STACK_NAME = ala-${PRODUCT_NAME}-${UI_APP}-pipeline-${CLEAN_BRANCH}
APP_STACK_NAME = ala-${PRODUCT_NAME}-${UI_APP}-${CLEAN_BRANCH}
SOURCE_BUCKET = ala-${PRODUCT_NAME}-${UI_APP}-${CLEAN_BRANCH}
MAX_AGE = 0

[testing]
MAX_AGE = 60
