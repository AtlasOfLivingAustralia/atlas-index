###
# occurrence-ui pipeline configuration, layered over cicd/config.ini and cicd/frontend/config.ini.
#
# VITE_* values are written to occurrence-ui/.env.production for `yarn build` (Vite bakes them into the bundle,
# so never put a secret here). They were seeded from occurrence-ui/.env.playwright, which holds every key the
# build requires, with local/mocked hosts mapped to the target environment and links to sibling
# atlas-index apps kept inside the same environment. Other ALA service URLs were kept as they are:
# DG-6, check them against the legacy deployment before the first deploy.
# A value of secretsmanager:<secret-id>:<json-key> is resolved at build time.

[DEFAULT]
UI_APP = occurrence-ui
UI_HOST = ${OCCURRENCE_UI_HOST}
SHARDS_PER_BROWSER = 1

VITE_ENV = ${ENVIRONMENT}
VITE_HOME_URL = https://ala.org.au
VITE_AUTH_COOKIE = ALA-Auth-Test-Local=
VITE_AUTH_COOKIE_DOMAIN = ${HOSTED_ZONE}
VITE_APP_BASE_URL = https://${OCCURRENCE_UI_HOST}
