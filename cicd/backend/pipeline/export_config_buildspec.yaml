version: 0.2
###
# Load the environment, keep the pipeline in sync with this revision and build the CloudFormation
# template configs for the ECR and WAF stacks (see cicd/export_config.sh)

env:
  shell: bash
  git-credential-helper: yes
  exported-variables:
    - DEPLOY_URL
    - ECR_STACK_NAME
    - EKS_NAMESPACE
    - HELM_RELEASE_NAME
    - PRODUCT_NAME
    - SLACK_ALERT_CHANNEL
    - SLACK_DEPLOY_NOTIFICATION
    - WAF_STACK_NAME

phases:
  install:
    commands:
      - pip install --quiet jinja2
  build:
    commands:
      - source cicd/export_config.sh
      - cicd/render_template_configs.sh

artifacts:
  files:
    - cicd/backend/app/*
    - env.sh
  discard-paths: no
