###
# search-service on the regolith EKS cluster. Values here are not secret; credentials and other
# sensitive properties live in the Secrets Manager secret APP_SECRET_NAME (see cicd/README.md).
#
# TODO-DG<n> marks an open decision gate: the pipeline refuses to deploy until it is resolved.
# An empty value is a valid resolution where noted.

[DEFAULT]
PRODUCT_COMPONENT = backend
PIPELINE_STACK_NAME = ala-${PRODUCT_NAME}-${PRODUCT_COMPONENT}-pipeline-${ENVIRONMENT}
ECR_STACK_NAME = ala-${PRODUCT_NAME}-ecr-${ENVIRONMENT}
WAF_STACK_NAME = ala-${PRODUCT_NAME}-backend-waf-${ENVIRONMENT}
HELM_RELEASE_NAME = atlas-index-search-service-${ENVIRONMENT}
EKS_NAMESPACE = apps
DEPLOY_URL = https://${SERVICE_HOST}

# JSON object of extra properties appended to the rendered search-service-config.properties,
# e.g. {"spring.datasource.password": "...", "webservice.client-secret": "..."}
APP_SECRET_NAME = ala-${PRODUCT_NAME}-search-service-${ENVIRONMENT}

# DG-5: IRSA role for the pod (S3 file stores, import data); empty = node role only
SERVICE_ROLE_ARN = TODO-DG5
SERVICE_ACCOUNT_NAME = search-service-${ENVIRONMENT}
# DG-5: s3:// prefix holding import/ (names DwCA) and the names-extract CSVs; empty = load manually
DATA_S3_URI = TODO-DG5
DATA_VOLUME_SIZE = 50Gi

# DG-5: data plane
ELASTIC_HOST = TODO-DG5
DATASOURCE_URL = TODO-DG5
DATASOURCE_USERNAME = atlas
RABBITMQ_HOST = TODO-DG5
RABBITMQ_USERNAME = atlas

# DG-4: OIDC client registered for https://${SERVICE_HOST} (login redirect) and every UI (logout)
OIDC_DISCOVERY_URI = TODO-DG4
OIDC_CLIENT_ID = TODO-DG4
USERDETAILS_URL = https://api.test.ala.org.au/userdetails/cognito/

CORS_ORIGINS = https://${ADMIN_UI_HOST},https://${DASHBOARD_UI_HOST},https://${DOI_UI_HOST},https://${OCCURRENCE_UI_HOST},https://${REGIONS_UI_HOST},https://${SDS_UI_HOST},https://${SEARCH_UI_HOST},https://${SPECIMENS_UI_HOST}

CPU_REQUEST = 1
MEMORY = 4Gi

[development]
PIPELINE_STACK_NAME = ala-${PRODUCT_NAME}-${PRODUCT_COMPONENT}-pipeline-${CLEAN_BRANCH}
ECR_STACK_NAME = ala-${PRODUCT_NAME}-ecr-${CLEAN_BRANCH}
WAF_STACK_NAME = ala-${PRODUCT_NAME}-backend-waf-${CLEAN_BRANCH}
HELM_RELEASE_NAME = atlas-index-search-service-${CLEAN_BRANCH}
SERVICE_ACCOUNT_NAME = search-service-${CLEAN_BRANCH}
APP_SECRET_NAME = ala-${PRODUCT_NAME}-search-service-testing
EKS_NAMESPACE = testing
# a feature branch UI on localhost can call its own service
CORS_ORIGINS = https://${ADMIN_UI_HOST},https://${DASHBOARD_UI_HOST},https://${DOI_UI_HOST},https://${OCCURRENCE_UI_HOST},https://${REGIONS_UI_HOST},https://${SDS_UI_HOST},https://${SEARCH_UI_HOST},https://${SPECIMENS_UI_HOST},http://localhost:5173

[testing]
EKS_NAMESPACE = testing

[staging]
USERDETAILS_URL = https://auth.ala.org.au/userdetails

[production]
USERDETAILS_URL = https://auth.ala.org.au/userdetails
