###
# search-service on the regolith EKS cluster. Values here are not secret. At deploy time
# cicd/backend/scripts/deploy_helm.sh adds the credentials: the database login (database stack),
# the Cognito clients (base stack), the shared Elasticsearch and RabbitMQ logins, and APP_SECRET_NAME.
#
# TODO-DG<n> marks an open decision gate: the pipeline refuses to deploy until it is resolved.

[DEFAULT]
PRODUCT_COMPONENT = backend
PIPELINE_STACK_NAME = ala-${PRODUCT_NAME}-${PRODUCT_COMPONENT}-pipeline-${ENVIRONMENT}
ECR_STACK_NAME = ala-${PRODUCT_NAME}-ecr-${ENVIRONMENT}
WAF_STACK_NAME = ala-${PRODUCT_NAME}-backend-waf-${ENVIRONMENT}
HELM_RELEASE_NAME = atlas-index-search-service-${ENVIRONMENT}
EKS_NAMESPACE = apps
DEPLOY_URL = https://${SERVICE_HOST}

# JSON object of any further secret properties (e.g. {"bhl.apikey": "..."}); may be {}
APP_SECRET_NAME = ala-${PRODUCT_NAME}-search-service-${ENVIRONMENT}

# optional IRSA role for the pod (e.g. S3 file stores); empty = the node role only
SERVICE_ROLE_ARN =
# optional s3:// prefix holding import/ (names DwCA) and the names-extract CSVs, synced onto the data
# volume at startup; empty = copy them onto the volume by hand
DATA_S3_URI =
DATA_VOLUME_SIZE = 50Gi

# shared regolith Elasticsearch (Elastic operator); this deployment uses its own indexes
ELASTIC_HOST = https://testing-cluster-es-http.elasticsearch.svc:9200
ELASTIC_SECRET_NAME = ala-regolith-testing-elasticsearch
# the cluster's self-signed CA, read from this Kubernetes secret and trusted by the pod
ELASTIC_NAMESPACE = elasticsearch
ELASTIC_CA_SECRET = testing-cluster-es-http-certs-public
ELASTIC_INDEX = atlas-index-${ENVIRONMENT}-search
ELASTIC_ADMIN_INDEX = atlas-index-${ENVIRONMENT}-search-log

# shared regolith RabbitMQ; the queue names are fixed, so each deployment needs its own virtual host
# (created once by hand, see cicd/README.md)
RABBITMQ_HOST = testing.rabbitmq.svc
RABBITMQ_SECRET_NAME = ala-regolith-testing-rabbitmq
RABBITMQ_VHOST = atlas-index-${ENVIRONMENT}

USERDETAILS_URL = https://api.test.ala.org.au/userdetails/cognito/
CORS_ORIGINS = ${UI_ORIGINS}

CPU_REQUEST = 1
MEMORY = 4Gi

[development]
PIPELINE_STACK_NAME = ala-${PRODUCT_NAME}-${PRODUCT_COMPONENT}-pipeline-${CLEAN_BRANCH}
ECR_STACK_NAME = ala-${PRODUCT_NAME}-ecr-${CLEAN_BRANCH}
WAF_STACK_NAME = ala-${PRODUCT_NAME}-backend-waf-${CLEAN_BRANCH}
HELM_RELEASE_NAME = atlas-index-search-service-${CLEAN_BRANCH}
APP_SECRET_NAME = ala-${PRODUCT_NAME}-search-service-testing
EKS_NAMESPACE = testing
ELASTIC_INDEX = atlas-index-${CLEAN_BRANCH}-search
ELASTIC_ADMIN_INDEX = atlas-index-${CLEAN_BRANCH}-search-log
RABBITMQ_VHOST = atlas-index-${CLEAN_BRANCH}
# a feature branch UI on localhost can call its own service
CORS_ORIGINS = ${UI_ORIGINS},http://localhost:5173

[testing]
EKS_NAMESPACE = testing

[staging]
USERDETAILS_URL = https://auth.ala.org.au/userdetails
ELASTIC_HOST = https://main-cluster-es-http.elasticsearch.svc:9200
ELASTIC_SECRET_NAME = ala-regolith-production-elasticsearch
ELASTIC_CA_SECRET = main-cluster-es-http-certs-public
RABBITMQ_HOST = TODO-DG9
RABBITMQ_SECRET_NAME = TODO-DG9

[production]
USERDETAILS_URL = https://auth.ala.org.au/userdetails
ELASTIC_HOST = https://main-cluster-es-http.elasticsearch.svc:9200
ELASTIC_SECRET_NAME = ala-regolith-production-elasticsearch
ELASTIC_CA_SECRET = main-cluster-es-http-certs-public
RABBITMQ_HOST = TODO-DG9
RABBITMQ_SECRET_NAME = TODO-DG9
