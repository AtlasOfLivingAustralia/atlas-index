AWSTemplateFormatVersion: "2010-09-09"

Description: atlas-index shared resources for one environment (Playwright reports bucket, build image repository, Cognito clients)

Parameters:
  pCallbackUrls:
    Description: URLs Cognito may redirect to after login (search-service callback and every UI)
    Type: CommaDelimitedList

  pCleanBranch:
    Description: A cleaned version of the code branch name
    Type: String
    Default: development

  pCognitoStackName:
    Description: The shared Cognito user pool stack
    Type: String

  pEnvironment:
    Description: The AWS environment this belongs to
    Type: String

  pLogoutUrls:
    Description: URLs Cognito may redirect to after logout (every UI's base URL)
    Type: CommaDelimitedList

  pReportRetentionDays:
    Description: Days to keep Playwright HTML reports
    Type: Number

Conditions:
  IsDev: !Equals
    - !Ref pEnvironment
    - development

  NotProd: !Not
    - !Equals
      - !Ref pEnvironment
      - production

Resources:

  PlaywrightReportsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-reports
            Status: Enabled
            ExpirationInDays: !Ref pReportRetentionDays
      Tags:
        - Key: component
          Value: playwright-reports

  PlaywrightReportsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PlaywrightReportsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TLSAccessOnly
            Action: s3:*
            Effect: Deny
            Resource:
              - !GetAtt PlaywrightReportsBucket.Arn
              - !Sub ${PlaywrightReportsBucket.Arn}/*
            Principal: '*'
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # Build image for every UI build/test action: Playwright browsers + OS deps, Node from .nvmrc,
  # the native toolchain for the `canvas` dependency, and the AWS CLI. Built by the base pipeline.
  PlaywrightImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: !If [ NotProd, true, false ]
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageScanningConfiguration:
        ScanOnPush: true
      RepositoryName: !Sub
        - atlas-index-playwright-${ResourceName}
        - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "keep the 5 most recent images",
                "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 5 },
                "action": { "type": "expire" }
              }
            ]
          }
      # CodeBuild pulls with its own service credentials (ImagePullCredentialsType: CODEBUILD)
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: CodeBuildPull
            Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # Login client for search-service, which signs users in for every UI (authorization code + PKCE,
  # so no secret). Modelled on the species-lists UI client.
  AppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub
        - atlas-index-${ResourceName}
        - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]
      UserPoolId: !ImportValue
        Fn::Sub: ${pCognitoStackName}-UserPoolId
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - ala/attrs
        - ala/internal
        - ala/roles
        - email
        - openid
        - profile
        - users/read
      CallbackURLs: !Ref pCallbackUrls
      LogoutURLs: !Ref pLogoutUrls
      SupportedIdentityProviders:
        - COGNITO
        - Facebook
        - Google
        - AAF
        - SignInWithApple
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 8
      IdTokenValidity: 8
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # Machine-to-machine client for search-service's calls to other ALA services (webservice.client-id).
  ServiceClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub
        - atlas-index-s2s-${ResourceName}
        - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]
      UserPoolId: !ImportValue
        Fn::Sub: ${pCognitoStackName}-UserPoolId
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthScopes:
        - ala/attrs
        - ala/internal
        - ala/roles
        - users/read
      EnableTokenRevocation: true
      AccessTokenValidity: 8
      TokenValidityUnits:
        AccessToken: hours

Outputs:
  AppClientId:
    Value: !Ref AppClient

  ServiceClientId:
    Value: !Ref ServiceClient

  PlaywrightReportsBucketName:
    Value: !Ref PlaywrightReportsBucket
    Export:
      Name: !Sub ${AWS::StackName}-PlaywrightReportsBucketName

  PlaywrightImageRepositoryName:
    Value: !Ref PlaywrightImageRepository

  PlaywrightImageRepositoryUri:
    Value: !GetAtt PlaywrightImageRepository.RepositoryUri
    Export:
      Name: !Sub ${AWS::StackName}-PlaywrightImageRepositoryUri
