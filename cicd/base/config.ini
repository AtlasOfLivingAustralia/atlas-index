###
# Shared per-environment resources: the CloudFront WAF used by every UI, the Playwright reports
# bucket, the Playwright build image, and the Cognito clients search-service signs users in with.
# Deploy this pipeline first in a new environment.

[DEFAULT]
PRODUCT_COMPONENT = base
PIPELINE_STACK_NAME = ala-${PRODUCT_NAME}-${PRODUCT_COMPONENT}-pipeline-${ENVIRONMENT}
PLAYWRIGHT_REPORT_RETENTION_DAYS = 30
# search-service's login callback, plus every UI origin
OIDC_CALLBACK_URLS = https://${SERVICE_HOST}/callback?client_name=OidcClient,https://${SERVICE_HOST},${UI_ORIGINS}

[development]
PIPELINE_STACK_NAME = ala-${PRODUCT_NAME}-${PRODUCT_COMPONENT}-pipeline-${CLEAN_BRANCH}
PLAYWRIGHT_REPORT_RETENTION_DAYS = 7

[production]
PLAYWRIGHT_REPORT_RETENTION_DAYS = 90
