###
# Product-wide CI/CD configuration, read first by gen_env_vars.py and layered with each component's
# config.ini (and, for UIs, cicd/frontend/<ui>/config.ini).
#
# Sections are environments, chosen by branch (see branch_2_env.py):
#   develop -> [testing], main/master -> [staging] or [production], any other branch -> [development]
#
# A value of TODO-DG<n> marks an open decision gate (see cicd/README.md). Pipelines refuse to deploy
# while any loaded value still contains TODO-DG.

[DEFAULT]
PRODUCT_NAME = atlas-index

AUTO_DEPLOY = true
GITHUB_REPO_NAME = atlas-index
GITHUB_OWNER = AtlasOfLivingAustralia
REGION = ap-southeast-2
ALLOW_TEARDOWN = true

# the bootstrap stack names. These are used by the codepipeline stacks to import
# the codepipeline roles, buckets and codestar connections
BOOTSTRAP_STACK_NAME = ala-bedrock-cicd-bootstrap-production
BUCKETS_STACK_NAME = ala-bedrock-cicd-buckets-production
COMMON_WAF_RULE_GROUP_STACK_NAME = ala-bedrock-waf-common-waf-rule-group-production
VPC_STACK_NAME = ala-bedrock-vpc-production
COGNITO_STACK_NAME = ala-cognito-pool-production

US_EAST_ARTIFACT_BUCKET = ala-code-pipeline-artifacts-${AWS_ACCOUNT_ID}-us-east-1-production

# per-environment stacks created by the base (WAF, reports, image, Cognito clients) and database pipelines
BASE_STACK_NAME = ala-${PRODUCT_NAME}-base-${ENVIRONMENT}
BASE_WAF_STACK_NAME = ala-${PRODUCT_NAME}-base-waf-${ENVIRONMENT}
DATABASE_STACK_NAME = ala-${PRODUCT_NAME}-database-${ENVIRONMENT}

SLACK_DEPLOY_NOTIFICATION = true
SLACK_ALERT_CHANNEL = testing-deployments

# Hostnames
# DOMAIN_SUFFIX keeps the AWS deployment off the legacy hostnames while both run side by side.
# Cutover (per environment): set DOMAIN_SUFFIX to empty once the legacy CloudFront alias / DNS record
# has been released (see "Legacy cutover" in cicd/README.md).
DOMAIN_SUFFIX = -cicd
# environment marker in the hostname (e.g. -staging, -<branch>); empty for testing and production
ENV_SUFFIX =

ADMIN_UI_HOST = admin${ENV_SUFFIX}${DOMAIN_SUFFIX}.${HOSTED_ZONE}
DASHBOARD_UI_HOST = dashboard${ENV_SUFFIX}${DOMAIN_SUFFIX}.${HOSTED_ZONE}
DOI_UI_HOST = doi${ENV_SUFFIX}${DOMAIN_SUFFIX}.${HOSTED_ZONE}
OCCURRENCE_UI_HOST = biocache${ENV_SUFFIX}${DOMAIN_SUFFIX}.${HOSTED_ZONE}
REGIONS_UI_HOST = regions${ENV_SUFFIX}${DOMAIN_SUFFIX}.${HOSTED_ZONE}
SDS_UI_HOST = sds${ENV_SUFFIX}${DOMAIN_SUFFIX}.${HOSTED_ZONE}
SEARCH_UI_HOST = bie${ENV_SUFFIX}${DOMAIN_SUFFIX}.${HOSTED_ZONE}
SPECIMENS_UI_HOST = specimens${ENV_SUFFIX}${DOMAIN_SUFFIX}.${HOSTED_ZONE}
SERVICE_HOST = service${ENV_SUFFIX}${DOMAIN_SUFFIX}.${HOSTED_ZONE}
# every UI: search-service CORS origins and the Cognito callback/logout URLs
UI_ORIGINS = https://${ADMIN_UI_HOST},https://${DASHBOARD_UI_HOST},https://${DOI_UI_HOST},https://${OCCURRENCE_UI_HOST},https://${REGIONS_UI_HOST},https://${SDS_UI_HOST},https://${SEARCH_UI_HOST},https://${SPECIMENS_UI_HOST}

# shared, read-only content still served by the existing ALA sites
COMMON_UI_URL = https://www.ala.org.au/commonui-bs5-2019
STATIC_URL = https://static.ala.org.au

[development]
ENV_SUFFIX = -${CLEAN_BRANCH}
COMMON_WAF_RULE_GROUP_STACK_NAME = ala-bedrock-waf-common-waf-rule-group-testing
COGNITO_STACK_NAME = ala-cognito-pool-testing
BASE_STACK_NAME = ala-${PRODUCT_NAME}-base-${CLEAN_BRANCH}
