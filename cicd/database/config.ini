###
# search-service's PostgreSQL database: Aurora PostgreSQL Serverless v2, modelled on the
# species-lists database component (DocumentDB). Deploy after base and before backend.

[DEFAULT]
PRODUCT_COMPONENT = database
PIPELINE_STACK_NAME = ala-${PRODUCT_NAME}-${PRODUCT_COMPONENT}-pipeline-${ENVIRONMENT}

DB_NAME = search
DB_USERNAME = atlas
# Aurora PostgreSQL; the local docker-compose database runs PostgreSQL 17
DB_ENGINE_VERSION = 17.11
# capacity is measured in ACUs (about 2 GiB of memory each)
DB_MIN_CAPACITY = 0.5
DB_MAX_CAPACITY = 2
BACKUP_RETENTION_DAYS = 7

[development]
PIPELINE_STACK_NAME = ala-${PRODUCT_NAME}-${PRODUCT_COMPONENT}-pipeline-${CLEAN_BRANCH}
BACKUP_RETENTION_DAYS = 1

[production]
DB_MAX_CAPACITY = 8
BACKUP_RETENTION_DAYS = 14
