apiVersion: v1
kind: Secret
metadata:
  name: {{ include "search-service.fullname" . }}-config
  labels:
    {{- include "search-service.labels" . | nindent 4 }}
type: Opaque
data:
  search-service-config.properties: {{ required "config (search-service-config.properties) is required" .Values.config | b64enc }}
  {{- with .Values.caCert }}
  ca.crt: {{ . | b64enc }}
  {{- end }}
