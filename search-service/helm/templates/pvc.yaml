apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "search-service.fullname" . }}-data
  labels:
    {{- include "search-service.labels" . | nindent 4 }}
  annotations:
    # keep the data (and the import) when the release is uninstalled and reinstalled
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.data.storageClass }}
  resources:
    requests:
      storage: {{ .Values.data.size }}
