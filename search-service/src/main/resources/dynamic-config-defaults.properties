#
# Scheduled Tasks Timing Configuration
#
# Configure cron expressions for scheduled tasks.
# These settings control if and when tasks are triggered automatically.
# This does not override the application.properties where tasks can be enabled or disabled.
#

# ES indexing tasks. ALL will trigger all other tasks. Enable separately if needed.
schedule.ALL.enabled=true
schedule.ALL.cron=0 0 11 * * ?
# excludes schedule.DWCA, this can only be run manually
#schedule.BIOCACHE.enabled=true
#schedule.BIOCACHE.cron=0 0 12 * * ?
