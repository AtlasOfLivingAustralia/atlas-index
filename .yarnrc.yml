# ---------------------------------------------------------------------------
# Yarn 4+ hardened configuration – supply chain attack mitigation
# Root workspace config — applies to all workspaces.
# ---------------------------------------------------------------------------

# --- Registry & transport ---------------------------------------------------

# Force HTTPS for all registry traffic; add hostnames here only if truly needed.
unsafeHttpWhitelist: []

# Reject SSL certificate errors (default true, but explicit is safer).
enableStrictSsl: true

# Pin to the canonical registry. Replace with an internal mirror if available.
npmRegistryServer: "https://registry.npmjs.org"

# --- Package integrity ------------------------------------------------------

# Hard-fail if a package checksum differs from what is recorded in the lockfile.
# 'warn' is the default – 'throw' is required for security.
checksumBehavior: throw

# Reject packages published fewer than 1 day ago.
# Set low to avoid constant npmPreapprovedPackages maintenance overhead
# while still providing a minimal window against typosquatting attacks.
npmMinimalAgeGate: 7d

# --- Lifecycle scripts (the #1 supply-chain attack vector) ------------------

# Never run postinstall / prepare / preinstall scripts from dependencies.
# Per-workspace overrides via dependenciesMeta (e.g. canvas) are still honoured.
enableScripts: false

# --- Lockfile discipline ----------------------------------------------------

# Fail if `yarn install` would mutate the lockfile (enforce reproducible builds).
# Use --no-immutable locally when adding/upgrading packages.
enableImmutableInstalls: true

# --- Git dependencies -------------------------------------------------------

# Deny all git-sourced dependencies by default.
# List explicit repos here only when a git dep is genuinely required, e.g.:
#   - "github.com/your-org/some-lib"
approvedGitRepositories: []

# --- Miscellaneous ----------------------------------------------------------

# Do not send usage data to Yarn's telemetry servers.
enableTelemetry: false

nodeLinker: node-modules
